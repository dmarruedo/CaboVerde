<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cabo Verde">
<meta name="theme-color" content="#0B2545">
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Cabo%20Verde%202026%22%2C%22short_name%22%3A%22Cabo%20Verde%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230B2545%22%2C%22theme_color%22%3A%22%230B2545%22%2C%22icons%22%3A%5B%5D%7D">
<title>🌊 Cabo Verde 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#FFF8F0 0%,#EDF4FF 100%);min-height:100vh;color:#111;}
  ::-webkit-scrollbar{display:none;}
  a{color:#4A90D9;text-decoration:none;}
  button{font-family:inherit;}

  .hero{background:linear-gradient(145deg,#0B2545 0%,#134074 55%,#1B6CA8 100%);padding:44px 18px 22px;position:relative;overflow:hidden;}
  .hero-circle1{position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:rgba(27,108,168,0.3);pointer-events:none;}
  .hero-circle2{position:absolute;bottom:-30px;left:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,140,60,0.15);pointer-events:none;}
  .hero-label{color:rgba(255,255,255,0.5);font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;cursor:pointer;}
  .hero-title{color:#fff;font-size:32px;font-family:'Playfair Display',serif;line-height:1.1;margin-bottom:4px;cursor:pointer;}
  .hero-sub{color:rgba(255,255,255,0.6);font-size:13px;margin-bottom:18px;cursor:pointer;}
  .stats{display:flex;gap:8px;margin-bottom:14px;}
  .stat{background:rgba(255,255,255,0.1);border-radius:12px;padding:7px 10px;flex:1;text-align:center;backdrop-filter:blur(8px);}
  .stat-n{color:#fff;font-size:17px;font-weight:700;}
  .stat-l{color:rgba(255,255,255,0.45);font-size:9px;text-transform:uppercase;letter-spacing:.06em;}
  .filters{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px;position:relative;z-index:10;}
  .filter-btn{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.7);border:none;border-radius:20px;padding:10px 18px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;min-height:38px;touch-action:manipulation;-webkit-user-select:none;user-select:none;position:relative;z-index:10;}
  .filter-btn.active{background:#fff;color:#0B2545;}

  .content{padding:14px 12px 90px;}
  .section-label{font-size:10px;font-weight:700;color:#94A3B8;letter-spacing:.1em;text-transform:uppercase;margin:0 4px 10px;}

  .card{background:#fff;border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.05);transition:box-shadow .2s;}
  .card.open{box-shadow:0 6px 28px rgba(0,0,0,0.09);}
  .card-header{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
  .card-emoji{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .card-meta{flex:1;min-width:0;}
  .card-day{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .card-title{font-size:15px;font-weight:700;color:#111;font-family:'Playfair Display',serif;line-height:1.2;margin-top:1px;}
  .card-island{font-size:10px;color:#94A3B8;}
  .card-arrow{font-size:10px;color:#CBD5E1;transition:transform .2s;flex-shrink:0;}
  .card-body{padding:0 15px 14px;display:none;}
  .card.open .card-body{display:block;}
  .card.open .card-arrow{transform:rotate(90deg);}
  .pending-badge{font-size:9px;background:#FEF3C7;color:#92400E;padding:1px 6px;border-radius:8px;font-weight:700;}
  .day-actions{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid #F1F5F9;}
  .day-action-btn{flex:1;background:#F8FAFC;border:none;border-radius:9px;padding:7px;font-size:11px;color:#475569;cursor:pointer;font-weight:600;}
  .day-action-btn:active{background:#E2E8F0;}
  .day-action-btn.danger{color:#DC2626;}

  .item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #F1F5F9;}
  .item:last-of-type{border-bottom:none;}
  .item-icon{font-size:16px;min-width:22px;margin-top:1px;}
  .item-content{flex:1;min-width:0;}
  .item-text{font-size:12px;color:#1a1a1a;line-height:1.45;margin-bottom:4px;word-break:break-word;}
  .item-tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
  .tag{font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:20px;text-transform:uppercase;display:inline-block;}
  .tag-link-small{font-size:9px;color:#4A90D9;}
  .item-actions{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:12px;padding:3px;line-height:1;color:#CBD5E1;}
  .icon-btn:active{color:#64748B;}

  .note-toggle{font-size:9px;color:#64748B;background:#F1F5F9;padding:2px 8px;border-radius:20px;cursor:pointer;border:none;font-weight:600;display:inline-flex;align-items:center;gap:3px;}
  .note-toggle:active{background:#E2E8F0;}
  .item-note{display:none;font-size:11px;color:#475569;background:#FEFCE8;border-left:3px solid #FACC15;border-radius:0 8px 8px 0;padding:8px 11px;margin-top:7px;line-height:1.45;white-space:pre-wrap;}
  .item-note.open{display:block;animation:noteSlide .18s ease;}
  @keyframes noteSlide{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}

  .add-item-btn{margin-top:10px;background:#F0F9FF;border:1.5px dashed #93C5FD;border-radius:10px;padding:9px 14px;font-size:12px;color:#1D4ED8;cursor:pointer;width:100%;font-weight:600;}
  .add-item-btn:active{background:#DBEAFE;}

  .hotel-footer{margin-top:10px;display:flex;align-items:center;background:#F8FAFC;border-radius:10px;padding:8px 11px;gap:6px;font-size:11px;color:#64748B;cursor:pointer;justify-content:space-between;}
  .hotel-footer:active{background:#E2E8F0;}
  .hotel-left{display:flex;align-items:center;gap:6px;min-width:0;flex:1;}
  .hotel-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .pending-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #F1F5F9;}
  .pending-item:last-of-type{border-bottom:none;}
  .checkbox{width:20px;height:20px;border-radius:6px;border:2px solid #D1D5DB;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;cursor:pointer;}
  .checkbox.done{background:#10B981;border-color:#10B981;}
  .checkbox.done::after{content:'✓';color:#fff;font-size:11px;}
  .pending-text{font-size:12px;color:#111;line-height:1.4;margin-bottom:2px;}
  .pending-text.done{text-decoration:line-through;color:#9CA3AF;}
  .pending-detail{font-size:10px;color:#94A3B8;}
  .urgency-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .legend{font-size:9px;color:#94A3B8;margin-top:8px;}

  .fab{position:fixed;bottom:20px;right:18px;background:linear-gradient(135deg,#1B6CA8,#0B2545);color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:24px;cursor:pointer;box-shadow:0 6px 20px rgba(11,37,69,0.4);z-index:50;}
  .fab:active{transform:scale(0.95);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:none;align-items:flex-end;justify-content:center;}
  .modal-backdrop.show{display:flex;animation:fadeIn .2s;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px 28px;max-height:90vh;overflow-y:auto;animation:slideUp .25s;}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{width:40px;height:4px;background:#E2E8F0;border-radius:2px;margin:0 auto 14px;}
  .modal-title{font-size:18px;font-weight:700;font-family:'Playfair Display',serif;margin-bottom:4px;}
  .modal-subtitle{font-size:11px;color:#94A3B8;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field-label{font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block;}
  .field-input,.field-textarea,.field-select{width:100%;border:1.5px solid #E2E8F0;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:#111;}
  .field-input:focus,.field-textarea:focus,.field-select:focus{outline:none;border-color:#4A90D9;}
  .field-textarea{resize:vertical;min-height:60px;}
  .field-textarea.large{min-height:90px;}

  .icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-height:140px;overflow-y:auto;padding:6px;background:#F8FAFC;border-radius:10px;}
  .icon-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:7px;cursor:pointer;background:#fff;border:1.5px solid transparent;}
  .icon-cell.selected{border-color:#4A90D9;background:#EFF6FF;}

  .tag-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .tag-pick{background:#F1F5F9;color:#475569;border:1.5px solid transparent;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;}
  .tag-pick.selected{border-color:#0B2545;background:#0B2545;color:#fff;}

  .color-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .color-cell{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
  .color-cell.selected{border-color:#0B2545;}

  .urgency-grid{display:flex;gap:6px;}
  .urgency-pick{flex:1;background:#F1F5F9;border:1.5px solid transparent;border-radius:10px;padding:8px;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;color:#475569;}
  .urgency-pick.selected{border-width:2px;}
  .urgency-pick[data-u="alta"].selected{background:#FEE2E2;color:#B91C1C;border-color:#EF4444;}
  .urgency-pick[data-u="media"].selected{background:#FEF3C7;color:#92400E;border-color:#F59E0B;}
  .urgency-pick[data-u="baja"].selected{background:#D1FAE5;color:#065F46;border-color:#10B981;}

  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .btn-primary{flex:1;background:#0B2545;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-primary:active{background:#1B6CA8;}
  .btn-secondary{flex:1;background:#F1F5F9;color:#475569;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-danger-full{width:100%;background:#FEE2E2;color:#B91C1C;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;}

  .tag-Vuelo{background:#EFF6FF;color:#1D4ED8;}
  .tag-Transporte{background:#F0F9FF;color:#0369A1;}
  .tag-Visita{background:#F0FDF4;color:#15803D;}
  .tag-Playa{background:#FFF7ED;color:#C2410C;}
  .tag-Paseo{background:#FDF4FF;color:#7E22CE;}
  .tag-Comer{background:#FFF1F2;color:#BE123C;}
  .tag-Noche{background:#EEF2FF;color:#4338CA;}
  .tag-Pendiente{background:#FFFBEB;color:#B45309;}
  .tag-Info{background:#F1F5F9;color:#475569;}
  .tag-Ruta{background:#F0FDF4;color:#166534;}
  .tag-Senderismo{background:#ECFDF5;color:#065F46;}
  .tag-Paisaje{background:#F0FDFA;color:#0F766E;}
  .tag-Actividad{background:#FAF5FF;color:#7C3AED;}
  .tag-Relax{background:#FFF7ED;color:#9A3412;}
  .tag-Otro{background:#F3F4F6;color:#374151;}

  /* COUNTDOWN BANNER */
  .countdown{background:rgba(255,255,255,0.13);backdrop-filter:blur(8px);border-radius:14px;padding:10px 14px;margin-top:12px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,0.1);}
  .countdown-icon{font-size:22px;}
  .countdown-text{flex:1;color:#fff;}
  .countdown-num{font-size:22px;font-weight:700;line-height:1;font-family:'Playfair Display',serif;}
  .countdown-label{font-size:11px;color:rgba(255,255,255,0.7);margin-top:2px;}

  /* TODAY HIGHLIGHT */
  .card.is-today{box-shadow:0 0 0 3px #FACC15,0 8px 30px rgba(250,204,21,0.35);animation:todayPulse 2.5s ease-in-out infinite;}
  @keyframes todayPulse{0%,100%{box-shadow:0 0 0 3px #FACC15,0 8px 30px rgba(250,204,21,0.35);}50%{box-shadow:0 0 0 4px #FACC15,0 8px 36px rgba(250,204,21,0.55);}}
  .today-badge{font-size:9px;background:#FACC15;color:#713F12;padding:2px 7px;border-radius:8px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}

  /* VIEW TOGGLE */
  .view-toggle{display:flex;background:#fff;border-radius:14px;padding:4px;gap:2px;margin:0 4px 12px;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
  .view-toggle button{flex:1;background:none;border:none;padding:9px;font-size:12px;font-weight:700;color:#94A3B8;cursor:pointer;border-radius:10px;transition:all .15s;}
  .view-toggle button.active{background:linear-gradient(135deg,#1B6CA8,#0B2545);color:#fff;}

  /* MAP VIEW */
  #map-view{display:none;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
  #map-view.active{display:block;}
  #map-container{height:65vh;min-height:400px;width:100%;}
  .map-legend{padding:10px 14px;font-size:11px;color:#64748B;border-top:1px solid #F1F5F9;}
  .leaflet-popup-content-wrapper{border-radius:12px!important;}
  .leaflet-popup-content{margin:10px 14px!important;font-family:'DM Sans',sans-serif!important;}
  .map-popup-title{font-size:13px;font-weight:700;color:#111;margin-bottom:3px;}
  .map-popup-date{font-size:10px;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .map-popup-btn{display:inline-block;background:#0B2545;color:#fff!important;padding:6px 11px;border-radius:8px;font-size:11px;font-weight:700;text-decoration:none;margin-top:4px;}
  .day-marker{background:transparent;border:none;}
  .day-marker-pin{width:32px;height:32px;border-radius:50% 50% 50% 0;background:#0B2545;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.3);}
  .day-marker-pin span{transform:rotate(45deg);font-size:14px;}
  .day-marker.today .day-marker-pin{background:#FACC15!important;animation:todayPulse 2.5s ease-in-out infinite;}

  /* OFFLINE INDICATOR */
  .offline-bar{position:fixed;top:0;left:0;right:0;background:#B45309;color:#fff;text-align:center;padding:6px;font-size:11px;font-weight:700;z-index:300;display:none;}
  .offline-bar.show{display:block;}
  body.is-offline{padding-top:28px;}

  /* WEATHER CHIP */
  .weather-chip{font-size:10px;background:#F0F9FF;color:#075985;padding:2px 7px;border-radius:8px;font-weight:700;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
  .weather-chip .w-rain{color:#0EA5E9;font-weight:700;margin-left:3px;}

  /* DRAG & DROP */
  .drag-handle{background:#F1F5F9!important;color:#94A3B8!important;border:none;cursor:grab;font-size:14px;padding:4px 8px;border-radius:6px;line-height:1;touch-action:none;}
  .drag-handle:active{cursor:grabbing;background:#E2E8F0!important;}
  .sortable-ghost{opacity:0.3;background:#FEF9C3!important;}
  .sortable-chosen{background:#FEF9C3!important;}
  .sortable-drag{box-shadow:0 8px 30px rgba(0,0,0,0.2)!important;border-radius:10px!important;}
  .items-wrap{}

  /* DAY REORDER BUTTONS */
  .day-action-btn.reorder{flex:0 0 auto;width:38px;padding:7px 0;}
  .day-action-btn:disabled{opacity:0.35;cursor:not-allowed;}

  /* TIME BADGE */
  .time-badge{display:inline-block;background:#0B2545;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;letter-spacing:.04em;font-variant-numeric:tabular-nums;}

  /* MAP LINK CHIP */
  .map-link-chip{font-size:9px;color:#16A34A;background:#F0FDF4;padding:2px 7px;border-radius:8px;cursor:pointer;border:none;font-weight:600;display:inline-flex;align-items:center;gap:3px;}
  .map-link-chip:active{background:#DCFCE7;}

  /* ITEM MARKERS (smaller, circular) */
  .item-marker{background:transparent;border:none;}
  .item-marker-pin{width:26px;height:26px;border-radius:50%;background:#0B2545;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
  .item-marker-pin span{font-size:12px;}
</style>
</head>
<body>

<div class="offline-bar" id="offline-bar">📵 Sin conexión — modo local</div>

<div class="hero">
  <div class="hero-circle1"></div><div class="hero-circle2"></div>
  <p class="hero-label" id="trip-label" onclick="editTrip()"></p>
  <h1 class="hero-title" id="trip-title" onclick="editTrip()"></h1>
  <p class="hero-sub" id="trip-sub" onclick="editTrip()"></p>
  <div class="stats">
    <div class="stat"><div class="stat-n" id="stat-days">0</div><div class="stat-l">días</div></div>
    <div class="stat"><div class="stat-n" id="stat-islands">0</div><div class="stat-l">islas</div></div>
    <div class="stat"><div class="stat-n" id="stat-items">0</div><div class="stat-l">planes</div></div>
    <div class="stat"><div class="stat-n" id="stat-pending">0</div><div class="stat-l">pend.</div></div>
  </div>
  <div class="filters" id="filters"></div>
  <div id="countdown-banner"></div>
</div>

<div class="content">
  <div class="view-toggle">
    <button id="btn-list" class="active" onclick="switchView('list')">📋 Lista</button>
    <button id="btn-map" onclick="switchView('map')">🗺️ Mapa</button>
  </div>
  <div id="list-view">
    <div id="pending-section"></div>
    <p class="section-label">Itinerario · toca cualquier elemento para editarlo</p>
    <div id="days-container"></div>
    <button class="add-item-btn" style="margin-top:14px;" onclick="newDay()">＋ Añadir día</button>
  </div>
  <div id="map-view">
    <div id="map-container"></div>
    <div class="map-legend">📍 Toca un marcador para ver el día. Estrella amarilla = día actual.</div>
  </div>
</div>

<button class="fab" id="fab" onclick="showMenu()">＋</button>

<div class="modal-backdrop" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<script>
const TAGS = ['Vuelo','Transporte','Visita','Playa','Paseo','Comer','Noche','Pendiente','Info','Ruta','Senderismo','Paisaje','Actividad','Relax','Otro'];

function autoAssignCoords(text){
  for (const rule of ACTIVITY_COORDS_KEYWORDS){
    if (rule.match.test(text)) return {lat:rule.lat, lng:rule.lng};
  }
  return null;
}

function migrateActivityCoords(){
  if (state.actvCoordsV1) return false;
  let count = 0;
  state.days.forEach(d => {
    d.items.forEach(item => {
      if (item.coords) return;
      const c = autoAssignCoords(item.text);
      if (c){ item.coords = c; count++; }
    });
  });
  state.actvCoordsV1 = true;
  return count > 0;
}

// Parser de fechas tipo "Mié 12 Ago" → Date object
const MONTHS = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11};
function parseDate(dateStr, year){
  if (!dateStr) return null;
  const m = dateStr.toLowerCase().match(/(\d{1,2})\s+([a-záéíóú]+)/);
  if (!m) return null;
  const day = parseInt(m[1], 10);
  const monthKey = m[2].slice(0,3);
  const month = MONTHS[monthKey];
  if (month === undefined) return null;
  return new Date(year || (state.trip?.tripYear || 2026), month, day);
}

function todayDateOnly(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function getTripDates(){
  if (!state.days.length) return null;
  const year = state.trip.tripYear || 2026;
  const first = parseDate(state.days[0].date, year);
  const last = parseDate(state.days[state.days.length-1].date, year);
  return first && last ? {first, last, year} : null;
}

function getTodayDayId(){
  const today = todayDateOnly();
  const year = state.trip.tripYear || 2026;
  for (const d of state.days){
    const dt = parseDate(d.date, year);
    if (dt && dt.getTime() === today.getTime()) return d.id;
  }
  return null;
}

function buildCountdownHTML(){
  const td = getTripDates();
  if (!td) return '';
  const today = todayDateOnly();
  const diffStart = Math.round((td.first - today) / 86400000);
  const diffEnd = Math.round((td.last - today) / 86400000);

  if (diffStart > 0){
    return `<div class="countdown">
      <div class="countdown-icon">⏳</div>
      <div class="countdown-text">
        <div class="countdown-num">Faltan ${diffStart} día${diffStart===1?'':'s'}</div>
        <div class="countdown-label">para empezar el viaje</div>
      </div>
    </div>`;
  }
  if (diffStart <= 0 && diffEnd >= 0){
    const todayId = getTodayDayId();
    const todayDay = state.days.find(d => d.id === todayId);
    if (todayDay){
      const dayNum = state.days.findIndex(d => d.id === todayId) + 1;
      return `<div class="countdown" style="background:rgba(250,204,21,0.2);border-color:rgba(250,204,21,0.4);">
        <div class="countdown-icon">📍</div>
        <div class="countdown-text">
          <div class="countdown-num">Día ${dayNum} — ${escapeHtml(todayDay.place)}</div>
          <div class="countdown-label">¡estás en el viaje!</div>
        </div>
      </div>`;
    }
    return `<div class="countdown" style="background:rgba(34,197,94,0.2);">
      <div class="countdown-icon">✈️</div>
      <div class="countdown-text">
        <div class="countdown-num">¡Estás de viaje!</div>
        <div class="countdown-label">${diffEnd} día${diffEnd===1?'':'s'} restante${diffEnd===1?'':'s'}</div>
      </div>
    </div>`;
  }
  // Trip ended
  const daysAgo = Math.abs(diffEnd);
  return `<div class="countdown" style="background:rgba(255,255,255,0.08);">
    <div class="countdown-icon">🏠</div>
    <div class="countdown-text">
      <div class="countdown-num">El viaje terminó</div>
      <div class="countdown-label">hace ${daysAgo} día${daysAgo===1?'':'s'}</div>
    </div>
  </div>`;
}

    document.body.appendChild(el);
  }
  el.style.background = color || 'rgba(11,37,69,0.92)';
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2000);
}

// Carga desde la nube (con fallback a local si falla)
async function loadStateFromCloud(){
  if (!BIN_ID || BIN_ID === 'PEGA_AQUI_TU_BIN_ID'){
    showSyncStatus('⚠️ Sin configurar — modo local', '#B45309');
    return loadStateLocal();
  }
  try {
    showSyncStatus('☁️ Cargando...');
    const res = await fetch(BIN_URL + '/latest', {
      headers: { 'X-Master-Key': MASTER_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const cloud = data.record;
    // Si el bin está vacío, usa los datos por defecto
    if (!cloud || !cloud.days || cloud.days.length === 0){
      showSyncStatus('☁️ Inicializando...', '#0369A1');
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
    // Backup local
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cloud)); }catch(e){}
    showSyncStatus('☁️ Sincronizado', '#15803D');
    return cloud;
  } catch (e) {
    console.error('Error cargando de la nube:', e);
    showSyncStatus('⚠️ Sin conexión — modo local', '#B45309');
    return loadStateLocal();
  }
}
function loadStateLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

// Guarda en la nube (con debounce para no saturar la API)
let saveTimer = null;
function saveState(){
  // Backup local inmediato
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  // Sube a la nube tras 1 segundo de inactividad
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStateToCloud, 1000);
}
async function saveStateToCloud(){
  if (!BIN_ID || BIN_ID === 'PEGA_AQUI_TU_BIN_ID') return;
  try {
    showSyncStatus('☁️ Guardando...');
    const res = await fetch(BIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': MASTER_KEY
      },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    lastCloudHash = hashState(state);
    showSyncStatus('☁️ Guardado', '#15803D');
  } catch (e) {
    console.error('Error guardando:', e);
    showSyncStatus('⚠️ Error al guardar (guardado local)', '#B45309');
  }
}

const EDIT_MODE_KEY = 'caboVerde2026_editMode';

function isEditMode(){ return editMode; }

function requestEditMode(){
  const pwd = prompt('🔒 Contraseña para editar:');

    editMode = true;

// Wrapper: comprueba modo edición antes de cualquier acción de escritura
function requireEdit(fn){
  return function(...args){
    if (!isEditMode()){
      if (!requestEditMode()) return;
    }
    return fn.apply(this, args);
  };
}
// Migration: ensure note field on items
state.days.forEach(d => d.items.forEach(i => { if (i.note === undefined) i.note = ''; }));

const uid = () => Math.random().toString(36).slice(2,9);
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function getIslandList(){
  const set = new Set();
  state.days.forEach(d => {
    if (!d.island) return;
    d.island.split(',').map(s => s.trim()).filter(Boolean).forEach(i => set.add(i));
  });
  return [...set];
}

        <div class="card-title">${done}/${total} completadas</div>
      </div>
      <span class="card-arrow">▶</span>
    </button>
    <div class="card-body">`;

          ${p.url?`<a href="${escapeHtml(p.url)}" target="_blank" onclick="event.stopPropagation()" style="font-size:9px;">🔗 abrir</a>`:''}
        </div>
      </div>

      <button class="icon-btn" onclick="editPending('${p.id}')">✏️</button>
    </div>`;

  html += `<button class="add-item-btn" onclick="newPending()">＋ Nueva gestión</button>`;

function renderDays(){
  const f = state.filter;
  const filtered = f === 'all' ? state.days : state.days.filter(d => {
    if (!d.island) return false;
    return d.island.split(',').map(s => s.trim()).includes(f);
  });
  let html = '';
  const todayId = getTodayDayId();
  filtered.forEach((day, viewIdx) => {
    const isOpen = !!state.open[day.id];
    const isToday = day.id === todayId;
    const hasPending = day.items.some(i => i.tag === 'Pendiente');
    const fullIdx = state.days.findIndex(d => d.id === day.id);
    const w = getWeather(day);
    const wHtml = w ? `<span class="weather-chip">${WMO_EMOJI[w.code]||'☁️'} ${w.max}°/${w.min}°${w.rain>=30?` <span class="w-rain">💧${w.rain}%</span>`:''}</span>` : '';
    html += `
    <div class="card ${isOpen?'open':''} ${isToday?'is-today':''}" id="card-${day.id}" data-day-id="${day.id}">
      <button class="card-header" style="border-left:4px solid ${day.color};" onclick="toggleOpen('${day.id}')">
        <div class="card-emoji" style="background:${day.color}22;">${day.emoji||'📍'}</div>
        <div class="card-meta">
          <div class="card-day" style="color:${day.color};">
            <span>${escapeHtml(day.date)}</span>
            ${isToday?'<span class="today-badge">📍 HOY</span>':''}
            ${hasPending?'<span class="pending-badge">⚠️ PEND.</span>':''}
            ${wHtml}
          </div>
          <div class="card-title">${escapeHtml(day.place)}</div>
          <div class="card-island">${escapeHtml(day.island||'')}</div>
        </div>
        <span class="card-arrow">▶</span>
      </button>
      <div class="card-body">`;

    html += `<div class="items-wrap" data-day-id="${day.id}">`;
    day.items.forEach((item, i) => {
      const noteId = `note-${day.id}-${i}`;
      const hasNote = item.note && item.note.trim().length > 0;
      const timeHtml = item.time ? `<span class="time-badge">🕐 ${escapeHtml(item.time)}</span>` : '';
      html += `
      <div class="item" data-item-idx="${i}">
        <span class="item-icon">${item.icon||'•'}</span>
        <div class="item-content">
          <div class="item-text">${timeHtml}${escapeHtml(item.text)}</div>
          <div class="item-tags">
            <span class="tag tag-${item.tag||'Otro'}">${escapeHtml(item.tag||'Otro')}</span>
            ${item.url?`<a class="tag-link-small" href="${escapeHtml(item.url)}" target="_blank">🔗 enlace</a>`:''}
            ${item.coords?`<button class="map-link-chip" onclick="goToItemOnMap('${day.id}',${i})">📍 mapa</button>`:''}
            ${hasNote?`<button class="note-toggle" onclick="toggleNote('${noteId}')">📝 nota</button>`:''}
          </div>
          ${hasNote?`<div class="item-note" id="${noteId}">${escapeHtml(item.note)}</div>`:''}
        </div>
        <div class="item-actions">
          ${isEditMode()?'<button class="drag-handle" title="Arrastra para mover">≡</button>':''}
          <button class="icon-btn" onclick="editItem('${day.id}',${i})">✏️</button>
        </div>
      </div>`;
    });
    html += `</div>`;

    html += `<button class="add-item-btn" onclick="newItem('${day.id}')">＋ Añadir actividad</button>`;

    if (day.hotel) {
      html += `<div class="hotel-footer" onclick="editHotel('${day.id}')">
        <div class="hotel-left">
          <span>🏨</span>`;
      if (day.hotelUrl) html += `<a href="${escapeHtml(day.hotelUrl)}" target="_blank" onclick="event.stopPropagation()" class="hotel-name">${escapeHtml(day.hotel)}</a>`;
      else html += `<span class="hotel-name">${escapeHtml(day.hotel)}</span>`;
      html += `</div><span style="color:#94A3B8;font-size:11px;">✏️</span></div>`;
    } else {
      html += `<button class="add-item-btn" style="background:#FFF7ED;border-color:#FED7AA;color:#C2410C;margin-top:10px;" onclick="editHotel('${day.id}')">＋ Añadir alojamiento</button>`;
    }

    const isFirst = fullIdx === 0;
    const isLast = fullIdx === state.days.length - 1;
    html += `
        <div class="day-actions">
          ${isEditMode()?`
          <button class="day-action-btn reorder" onclick="moveDay('${day.id}',-1)" ${isFirst?'disabled':''} title="Subir">↑</button>
          <button class="day-action-btn reorder" onclick="moveDay('${day.id}',1)" ${isLast?'disabled':''} title="Bajar">↓</button>`:''}
          <button class="day-action-btn" onclick="editDay('${day.id}')">✏️ Editar</button>
          <button class="day-action-btn" onclick="duplicateDay('${day.id}')">📋 Duplicar</button>
          <button class="day-action-btn danger" onclick="deleteDay('${day.id}')">🗑</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('days-container').innerHTML = html;

  // Inicializa Sortable solo en modo edición
  if (isEditMode() && typeof Sortable !== 'undefined'){
    document.querySelectorAll('#days-container .items-wrap').forEach(container => {
      const dayId = container.dataset.dayId;
      Sortable.create(container, {
        handle: '.drag-handle',
        animation: 200,
        onEnd: function(evt){
          if (evt.oldIndex === evt.newIndex) return;
          const day = state.days.find(d => d.id === dayId);
          if (!day) return;
          const item = day.items.splice(evt.oldIndex, 1)[0];
          day.items.splice(evt.newIndex, 0, item);
          saveState();
          renderDays();
        }
      });
    });
  }
}

function moveDay(id, dir){
  if (!isEditMode() && !requestEditMode()) return;
  const idx = state.days.findIndex(d => d.id === id);
  if (idx === -1) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= state.days.length) return;
  const [d] = state.days.splice(idx, 1);
  state.days.splice(newIdx, 0, d);
  saveState();
  renderDays();
}

function deleteDay(id){
  if (!isEditMode() && !requestEditMode()) return;
  if (!confirm('¿Borrar este día? Se perderán todas sus actividades.')) return;
  state.days = state.days.filter(x=>x.id!==id);
  delete state.open[id];
  saveState(); render();
}
function duplicateDay(id){
  if (!isEditMode() && !requestEditMode()) return;
  const d = state.days.find(x=>x.id===id);
  if (!d) return;
  const copy = JSON.parse(JSON.stringify(d));
  copy.id = 'd'+uid();
  copy.place = d.place + ' (copia)';
  const idx = state.days.findIndex(x=>x.id===id);
  state.days.splice(idx+1, 0, copy);
  saveState(); render();
}

    icon: document.querySelector('#grid-icon .selected')?.dataset.icon || '📍',

    const auto = autoAssignCoords(text);
    if (auto) data.coords = auto;
  }
  // En edición sin coords explícitas, las quitamos (el usuario las borró deliberadamente)

  if (editingCtx.isNew) d.items.push(data);

// ═══════════ WEATHER (Open-Meteo, sin API key) ═══════════
const WMO_EMOJI = {
  0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
  45:'🌫️', 48:'🌫️',
  51:'🌦️', 53:'🌦️', 55:'🌦️',
  56:'🌧️', 57:'🌧️',
  61:'🌧️', 63:'🌧️', 65:'🌧️',
  66:'🌧️', 67:'🌧️',
  71:'🌨️', 73:'🌨️', 75:'🌨️', 77:'🌨️',
  80:'🌦️', 81:'🌧️', 82:'⛈️',
  85:'🌨️', 86:'🌨️',
  95:'⛈️', 96:'⛈️', 99:'⛈️'
};
const WEATHER_CACHE_KEY = 'caboVerde2026_weather';
let weatherCache = {};
try{ weatherCache = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY)) || {}; }catch(e){}

function weatherKey(coords){
  return `${coords.lat.toFixed(2)}_${coords.lng.toFixed(2)}`;
}

async function fetchAllWeather(){
  if (!navigator.onLine) return;
  const groups = {};
  state.days.forEach(d => {
    if (!d.coords) return;
    const k = weatherKey(d.coords);
    if (!groups[k]) groups[k] = {lat:d.coords.lat, lng:d.coords.lng};
  });

  let updated = false;
  for (const k of Object.keys(groups)){
    const cached = weatherCache[k];
    // Cache válido durante 3h
    if (cached && (Date.now() - cached.t < 3*3600*1000)) continue;
    const g = groups[k];
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lng}&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=auto&forecast_days=16`;
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();
      weatherCache[k] = {t: Date.now(), daily: data.daily};
      updated = true;
    } catch(e){}
  }
  if (updated){
    try{ localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(weatherCache)); }catch(e){}
    // Re-render solo si estamos en lista para mostrar el tiempo
    if (currentView === 'list') renderDays();
  }
}

function getWeather(day){
  if (!day.coords) return null;
  const cache = weatherCache[weatherKey(day.coords)];
  if (!cache || !cache.daily) return null;
  const year = state.trip.tripYear || 2026;
  const dt = parseDate(day.date, year);
  if (!dt) return null;
  const iso = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  const idx = cache.daily.time.indexOf(iso);
  if (idx === -1) return null;
  return {
    code: cache.daily.weather_code[idx],
    max: Math.round(cache.daily.temperature_2m_max[idx]),
    min: Math.round(cache.daily.temperature_2m_min[idx]),
    rain: cache.daily.precipitation_probability_max[idx]
  };
}

// ═══════════ MAP VIEW ═══════════
let mapInstance = null;
let mapMarkers = [];
let currentView = 'list';

function switchView(v){
  currentView = v;
  document.getElementById('list-view').style.display = v === 'list' ? '' : 'none';
  document.getElementById('map-view').classList.toggle('active', v === 'map');
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
  document.getElementById('btn-map').classList.toggle('active', v === 'map');
  if (v === 'map') {
    // Esperar a que el contenedor sea visible antes de inicializar
    setTimeout(initMap, 50);
  }
}

function initMap(){
  if (mapInstance) {
    mapInstance.invalidateSize();
    refreshMap();
    return;
  }
  if (typeof L === 'undefined') {
    document.getElementById('map-container').innerHTML = '<div style="padding:30px;text-align:center;color:#94A3B8;">No se pudo cargar el mapa.<br>Verifica tu conexión.</div>';
    return;
  }
  mapInstance = L.map('map-container', {zoomControl:true, attributionControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 18,
  }).addTo(mapInstance);
  refreshMap();
}

function refreshMap(){
  if (!mapInstance) return;
  // Limpiar marcadores anteriores
  mapMarkers.forEach(m => mapInstance.removeLayer(m));
  mapMarkers = [];

  const f = state.filter;
  const days = f === 'all' ? state.days : state.days.filter(d => d.island && d.island.split(',').map(s=>s.trim()).includes(f));
  const todayId = getTodayDayId();
  const bounds = [];

  days.forEach((day, idx) => {
    const dayNum = state.days.findIndex(d => d.id === day.id) + 1;
    const isToday = day.id === todayId;

    // PIN GRANDE del día
    if (day.coords && day.coords.lat){
      const icon = L.divIcon({
        className: 'day-marker' + (isToday?' today':''),
        html: `<div class="day-marker-pin" style="background:${day.color};"><span>${day.emoji||'📍'}</span></div>`,
        iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -28]
      });
      const marker = L.marker([day.coords.lat, day.coords.lng], {icon}).addTo(mapInstance);
      const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${day.coords.lat},${day.coords.lng}`;
      marker.bindPopup(`
        <div class="map-popup-title">${day.emoji||'📍'} Día ${dayNum} · ${escapeHtml(day.place)}</div>
        <div class="map-popup-date">${escapeHtml(day.date)} · ${escapeHtml(day.island||'')}</div>
        <div style="font-size:11px;color:#64748B;margin-top:4px;">${day.items.length} actividad${day.items.length===1?'':'es'}${day.hotel?' · 🏨 '+escapeHtml(day.hotel):''}</div>
        <a href="${gmapsUrl}" target="_blank" class="map-popup-btn">🧭 Abrir en Maps</a>
        <button onclick="goToDay('${day.id}')" style="background:#F1F5F9;color:#475569;border:none;padding:6px 11px;border-radius:8px;font-size:11px;font-weight:700;margin-top:4px;margin-left:4px;cursor:pointer;font-family:inherit;">📋 Ver detalle</button>
      `);
      marker._mapId = 'day-' + day.id;
      mapMarkers.push(marker);
      bounds.push([day.coords.lat, day.coords.lng]);
    }

    // PINES PEQUEÑOS de actividades con coordenadas
    day.items.forEach((item, i) => {
      if (!item.coords || !item.coords.lat) return;
      const itemIcon = L.divIcon({
        className: 'item-marker',
        html: `<div class="item-marker-pin" style="background:${day.color};"><span>${item.icon||'📍'}</span></div>`,
        iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -10]
      });
      const itemMarker = L.marker([item.coords.lat, item.coords.lng], {icon:itemIcon}).addTo(mapInstance);
      const gmaps = `https://www.google.com/maps/search/?api=1&query=${item.coords.lat},${item.coords.lng}`;
      const timeText = item.time ? `🕐 ${item.time} · ` : '';
      itemMarker.bindPopup(`
        <div class="map-popup-title">${item.icon||'📍'} ${escapeHtml(item.text)}</div>
        <div class="map-popup-date">${timeText}Día ${dayNum} · ${escapeHtml(day.date)}</div>
        <div style="font-size:10px;color:#94A3B8;margin-top:2px;text-transform:uppercase;letter-spacing:.04em;">${escapeHtml(item.tag||'')}</div>
        <a href="${gmaps}" target="_blank" class="map-popup-btn">🧭 Abrir en Maps</a>
      `);
      itemMarker._mapId = 'item-' + day.id + '-' + i;
      mapMarkers.push(itemMarker);
      bounds.push([item.coords.lat, item.coords.lng]);
    });
  });

  if (bounds.length > 0){
    mapInstance.fitBounds(bounds, {padding:[40,40], maxZoom:11});
    // Si hay día actual, abre su popup
    if (todayId){
      const target = mapMarkers.find(m => m._mapId === 'day-' + todayId);
      if (target) setTimeout(() => target.openPopup(), 400);
    }
  }
}

function goToItemOnMap(dayId, itemIdx){
  const day = state.days.find(d => d.id === dayId);
  if (!day || !day.items[itemIdx]?.coords) return;
  switchView('map');
  setTimeout(() => {
    if (!mapInstance) return;
    const c = day.items[itemIdx].coords;
    mapInstance.setView([c.lat, c.lng], 15);
    const target = mapMarkers.find(m => m._mapId === 'item-' + dayId + '-' + itemIdx);
    if (target) target.openPopup();
  }, 300);
}

// ═══════════ AUTO-SYNC ═══════════
let autoSyncTimer = null;
let lastCloudHash = '';

function hashState(s){
  // Hash simple del contenido relevante (trip + days + pending)
  return JSON.stringify({trip:s.trip, days:s.days, pending:s.pending});
}

async function startAutoSync(){
  lastCloudHash = hashState(state);
  if (autoSyncTimer) clearInterval(autoSyncTimer);
  autoSyncTimer = setInterval(checkCloudUpdates, 30000);
}

async function checkCloudUpdates(){
  // Pausar si hay un modal abierto o si se está editando
  if (document.getElementById('modal').classList.contains('show')) return;
  if (!navigator.onLine) return;
  if (!BIN_ID || BIN_ID === 'PEGA_AQUI_TU_BIN_ID') return;

  try {
    const res = await fetch(BIN_URL + '/latest', {
      headers: { 'X-Master-Key': MASTER_KEY }
    });
    if (!res.ok) return;
    const data = await res.json();
    const cloud = data.record;
    if (!cloud || !cloud.days) return;
    const cloudHash = hashState(cloud);
    if (cloudHash !== lastCloudHash && cloudHash !== hashState(state)){
      // Hay cambios remotos
      showSyncStatus('☁️ Cambios detectados — actualizando', '#0369A1');
      // Preserva preferencias locales (open, filter, edit mode)
      const localOpen = state.open;
      const localFilter = state.filter;
      state = cloud;
      if (state.days) state.days.forEach(d => d.items.forEach(i => { if (i.note === undefined) i.note = ''; }));
      if (state.days) state.days.forEach(d => { if (!d.coords && DEFAULT_COORDS[d.id]) d.coords = {...DEFAULT_COORDS[d.id]}; });
      state.open = localOpen;
      state.filter = localFilter;
      lastCloudHash = cloudHash;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
      render();
      if (currentView === 'map') refreshMap();
    }
  } catch (e) {}
}

// ═══════════ CONNECTION MONITOR ═══════════
function setupConnectionMonitor(){
  const updateState = () => {
    const offline = !navigator.onLine;
    document.getElementById('offline-bar').classList.toggle('show', offline);
    document.body.classList.toggle('is-offline', offline);
    if (!offline){
      // Vuelve la conexión: forzar guardado pendiente y revisar cambios remotos
      if (saveTimer) saveStateToCloud();
      checkCloudUpdates();
    }
  };
  window.addEventListener('online', updateState);
  window.addEventListener('offline', updateState);
  updateState();
}

function resetAll(){
  if (!isEditMode() && !requestEditMode()) return;
  if (!confirm('¿Borrar TODOS tus cambios y volver al plan original? (también en la nube)')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  saveStateToCloud();
  render();
  closeModal();
}

// INIT: carga desde la nube y luego renderiza
(async function init(){
  state = await loadStateFromCloud();
  // Migración: asegura que cada item tenga campo note
  if (state.days) state.days.forEach(d => d.items.forEach(i => { if (i.note === undefined) i.note = ''; }));
  // Migración: añade coords por defecto a días que no las tienen
  if (state.days) state.days.forEach(d => { if (!d.coords && DEFAULT_COORDS[d.id]) d.coords = {...DEFAULT_COORDS[d.id]}; });
  // Migración: auto-asigna coordenadas a actividades famosas
  const migratedCoords = migrateActivityCoords();
  if (!state.trip) state.trip = {...DEFAULT_TRIP};
  if (!state.trip.tripYear) state.trip.tripYear = 2026;
  if (!state.filter) state.filter = 'all';
  if (!state.open) state.open = {};
  // Auto-abrir el día actual si lo hay
  const todayId = getTodayDayId();
  if (todayId && state.open[todayId] === undefined) state.open[todayId] = true;
  render();
  // Si la migración añadió cosas, súbelas al cloud
  if (migratedCoords) saveStateToCloud();
  // Sincronización automática cada 30s
  startAutoSync();
  // Detección de online/offline
  setupConnectionMonitor();
  // Service Worker para modo offline
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  // Tiempo (Open-Meteo, sin API key)
  fetchAllWeather();
})();
</script>
</body>
</html>
